# Practice: nada de mobs/animais consumindo tick. Chaves ausentes são regeneradas.
settings:
  allow-end: false
  warn-on-overload: true
  spawn-radius: 0
spawn-limits:
  monsters: 0
  animals: 0
  water-animals: 0
  water-ambient: 0
  ambient: 0
ticks-per:
  animal-spawns: 400
  monster-spawns: 400
  autosave: 6000
chunk-gc:
  period-in-ticks: 600
