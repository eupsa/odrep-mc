# odrep-mc — practice PvP. Copiado para run/ pelo setup (não sobrescreve se já existir).
# Docs: https://minecraft.wiki/w/Server.properties

# --- Identidade / rede ---
motd=§b§lodrep §8» §fpractice
server-port=25565
server-ip=
online-mode=true
prevent-proxy-connections=false
network-compression-threshold=256
rate-limit=0

# --- Acesso ---
white-list=false
enforce-whitelist=false
max-players=100
pvp=true
# false: clientes 1.8 via ViaVersion não assinam chat; true trava o chat deles
enforce-secure-profile=false

# --- Mundo ---
# 'flat' quebra a luz em clientes 1.8 via ViaVersion (chão preto). Usamos 'normal'
# com view-distance baixo; o lobby/arenas ficam na superfície ou num void depois.
level-name=world
level-type=minecraft\:normal
generator-settings=
level-seed=
generate-structures=false
spawn-monsters=false
spawn-npcs=false
spawn-animals=false
allow-nether=false
allow-end=false
difficulty=peaceful
# creative durante a montagem do lobby/arenas; troque p/ adventure quando abrir ao público
gamemode=creative
force-gamemode=false
hardcore=false
view-distance=6
simulation-distance=5
entity-broadcast-range-percentage=60

# --- Anti-abuso ---
max-tick-time=60000
player-idle-timeout=0
spawn-protection=0
enable-command-block=false
function-permission-level=2
op-permission-level=4

# --- Infra ---
enable-rcon=false
enable-query=false
sync-chunk-writes=false
use-native-transport=true
