# Copiado para run/plugins/ViaVersion/config.yml pelo setup.
# Deixa clientes 1.8.9 .. atual entrarem num Paper 1.21.8.
# ViaBackwards e ViaRewind NÃO precisam de config — só do .jar.
check-for-updates: false
prevent-collision: true
